server:
  port: 8080
  forward-headers-strategy: framework
spring:
  application:
    name: checkmate
  datasource:
    url: jdbc:h2:mem:checkmate;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30d

auth:
  dev-login:
    enabled: ${DEV_LOGIN_ENABLED:false}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  places:
    api-key: ${GOOGLE_PLACES_KEY}

gms:
  base-url: ${GMS_BASE_URL}
  api-key: ${GMS_KEY}
  model: ${GMS_MODEL:gpt-4o-mini}
