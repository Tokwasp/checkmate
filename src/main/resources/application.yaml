server:
  port: 8080
  forward-headers-strategy: framework
spring:
  application:
    name: checkmate
  datasource:
    url: jdbc:h2:mem:checkmate;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30d

auth:
  dev-login:
    enabled: ${DEV_LOGIN_ENABLED:false}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  places:
    api-key: ${GOOGLE_PLACES_KEY}

gms:
  base-url: ${GMS_BASE_URL}
  api-key: ${GMS_KEY}
  model: ${GMS_MODEL:gpt-4o-mini}
  # 촬영 물품 반입 판정(35번) 전용. GMS는 벤더별 경로라 Claude는 OpenAI 경로(base-url)가 아니라 Anthropic 경로로
  # 호출해야 한다(OpenAI 경로에 Claude 모델을 보내면 model_not_found 404). 경로 전체(.../v1/messages)를 적는다.
  vision-base-url: ${GMS_VISION_BASE_URL:https://gms.ssafy.io/gmsapi/api.anthropic.com/v1/messages}
  # model과 분리해 15번이 함께 바뀌지 않게 한다.
  vision-model: ${GMS_VISION_MODEL:}

# 물품 인식 등록(26번)의 인벤토리 사진 저장소. bucket이 비어 있으면 S3 대신 local-dir에 저장한다.
storage:
  local-dir: ${STORAGE_LOCAL_DIR:./uploads}
  bucket: ${AWS_S3_BUCKET:}
  region: ${AWS_S3_REGION:ap-northeast-2}
  base-url: ${AWS_S3_BASE_URL:}

# 반입 규정 검사(30번). knowledge-base-id가 비어 있으면 검사 요청이 실패한다.
bedrock:
  region: ${AWS_BEDROCK_REGION:ap-northeast-2}
  knowledge-base-id: ${BEDROCK_KB_ID:}
  # Sonnet 4.6과 정확도가 같으면서 비용 1/3 (46케이스 x 3회 비교, RAG_검색품질_모델선정_리포트.md)
  model-id: ${BEDROCK_MODEL_ID:global.anthropic.claude-haiku-4-5-20251001-v1:0}
  # 물품 이름 하나당 가져올 청크 수(물품별로 따로 검색한다)
  number-of-results: ${BEDROCK_SEARCH_RESULTS:15}
  max-tokens: ${BEDROCK_MAX_TOKENS:4000}
