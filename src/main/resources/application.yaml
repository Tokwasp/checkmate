server:
  port: 8080
  forward-headers-strategy: framework
spring:
  application:
    name: checkmate
  datasource:
    url: jdbc:h2:mem:checkmate;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30d

auth:
  dev-login:
    enabled: ${DEV_LOGIN_ENABLED:false}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  places:
    api-key: ${GOOGLE_PLACES_KEY}

gms:
  base-url: ${GMS_BASE_URL}
  api-key: ${GMS_KEY}
  model: ${GMS_MODEL:gpt-4o-mini}

# 물품 인식 등록(26번)의 인벤토리 사진 저장소. bucket이 비어 있으면 S3 대신 local-dir에 저장한다.
storage:
  local-dir: ${STORAGE_LOCAL_DIR:./uploads}
  bucket: ${AWS_S3_BUCKET:}
  region: ${AWS_S3_REGION:ap-northeast-2}
  base-url: ${AWS_S3_BASE_URL:}

