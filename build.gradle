plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ssafy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'me.paulschwarz:springboot4-dotenv:5.1.0' // Boot 4용. spring-dotenv 4.0.0은 Boot 3 전용으로 Boot 4에서 .env를 읽지 못함
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.13.0'
	implementation platform("software.amazon.awssdk:bom:2.46.8") // 물품 인식 등록(26번) 이미지 S3 업로드
	implementation "software.amazon.awssdk:s3"
	implementation "software.amazon.awssdk:bedrockagentruntime" // 반입 규정 검사(30번) 지식베이스 검색
	implementation "software.amazon.awssdk:bedrockruntime"      // 반입 규정 검사(30번) 판정 생성
}

tasks.named('test') {
	useJUnitPlatform()
	// 실호출 수동 IT(SearchLanguageComparisonManualIT)를 켜는 스위치.
	// 그레이들 데몬이 먼저 떠 있으면 셸 환경변수가 테스트 JVM까지 안 내려가서 명시적으로 넘긴다.
	environment 'RAG_COMPARE', System.getenv('RAG_COMPARE') ?: 'false'
	environment 'RAG_COMPARE_COUNTRIES', System.getenv('RAG_COMPARE_COUNTRIES') ?: ''
	environment 'RAG_COMPARE_MODELS', System.getenv('RAG_COMPARE_MODELS') ?: ''
}
